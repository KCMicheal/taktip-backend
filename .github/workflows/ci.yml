name: CI

# ============================================================
# ⏱  TRIGGER STRATEGY
# Only run when it actually matters:
#   - Push to staging (deployments)
#   - PRs to staging (your review workflow)
#   - Skip documentation-only changes
# ============================================================
on:
  push:
    branches: [staging]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [staging]
    paths-ignore: ['**.md', 'docs/**']

# ============================================================
# 🛑  CONCURRENCY — Cancel in-progress runs when a new push
#     lands on the same branch. Saves minutes by not running
#     CI on stale code.
# ============================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Build, Test & Health Check
    runs-on: ubuntu-latest

    # ── Services: spin up Postgres + Redis ONCE ──
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taktip_test
          POSTGRES_USER: taktip
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://taktip:testpassword@localhost:5432/taktip_test
      REDIS_URL: redis://localhost:6379
      APP_PORT: 3001
      # Dummy Mailjet creds — MailService calls apiConnect() in its constructor
      # and throws if these are missing. The values are never actually called in CI.
      MAILJET_API_KEY: ci-dummy-key
      MAILJET_API_SECRET: ci-dummy-secret

    steps:
      # ── Checkout & Setup ──
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version auto-detected from package.json's "packageManager" field

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Code Quality ──
      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      # ── Build ──
      - name: Build
        run: pnpm run build

      # ── Tests ──
      - name: Run tests
        run: pnpm run test

      # ── Health check (server boots + responds) ──
      - name: Start server & verify health
        run: |
          # Start server in background (nest build outputs to dist/src/)
          node dist/src/main &
          SERVER_PID=$!

          # Poll until server responds (up to 30s)
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:${{ env.APP_PORT }}/api/v1/health" > /dev/null 2>&1; then
              echo "✅ Server is up (attempt $i)"
              break
            fi
            echo "⏳ Waiting for server... attempt $i"
            sleep 2
          done

          # Run the actual health checks
          echo "── Health endpoint ──"
          curl -f "http://localhost:${{ env.APP_PORT }}/api/v1/health"
          echo ""

          echo "── Liveness probe ──"
          curl -f "http://localhost:${{ env.APP_PORT }}/api/v1/health/live"
          echo ""

          echo "── Readiness probe ──"
          curl -f "http://localhost:${{ env.APP_PORT }}/api/v1/health/ready"
          echo ""

          echo "✅ All health checks passed"

          # Gracefully stop the server
          kill $SERVER_PID 2>/dev/null || true
