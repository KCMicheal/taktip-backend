version: "3.9"

services:
  # ============================================
  # PostgreSQL 16 Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: taktip-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: taktip
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: taktip_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taktip -d taktip_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Redis 7 (for BullMQ queues)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: taktip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
